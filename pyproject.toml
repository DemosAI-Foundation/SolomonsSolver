[project]
name = "solomon"
version = "0.1.0"
description = "Three-Tier Intelligence Agent: Lightning / Deep / Omega with shared Critique Reasoning Gate"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
    "structlog>=24.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
solomon = "src.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "config*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that call the real llama.cpp server (deselect with '-m \"not live\"')",
]
